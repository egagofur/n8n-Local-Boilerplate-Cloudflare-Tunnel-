# n8n local boilerplate: Postgres + n8n + optional Cloudflare Tunnel
#
# Profiles:
#   tunnel       — Quick Tunnel (ephemeral https://*.trycloudflare.com)  [default via .env]
#   named-tunnel — Stable hostname via CLOUDFLARE_TUNNEL_TOKEN
#   (none)       — Local only: postgres + n8n (no public exposure)
#
# Image tags are overridable via .env (N8N_IMAGE, CLOUDFLARED_IMAGE, POSTGRES_IMAGE).

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_net

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.31.7}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # n8n 2.x: N8N_WEBHOOK_URL is the preferred base for test + production webhooks.
      # WEBHOOK_URL kept for older docs/tooling; both are set from the same .env value.
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Jakarta}
      TZ: ${GENERIC_TIMEZONE:-Asia/Jakarta}

      # Safer defaults for a local lab (override in .env if needed)
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Set to 1 when traffic reaches n8n via Cloudflare Tunnel / reverse proxy
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}

      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_net

  # Ephemeral public HTTPS (rotates URL on restart). Exposes FULL n8n HTTP surface.
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - n8n_net

  # Stable public hostname. Set CLOUDFLARE_TUNNEL_TOKEN + WEBHOOK_URL in .env.
  # Prefer locking the tunnel in Cloudflare Zero Trust to webhook paths only.
  cloudflared-named:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    restart: unless-stopped
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - n8n_net

volumes:
  postgres_data:
  n8n_data:

networks:
  n8n_net:
    name: n8n_net
